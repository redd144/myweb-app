apiVersion: apps/v1
kind: Deployment

metadata:
  name: webapp-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
      - name: webapp

        image: YOUR_DOCKER_USERNAME/devops-webapp:latest

        ports:
        - containerPort: 3000
