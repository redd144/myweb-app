
apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-webapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-webapp

  template:
    metadata:
      labels:
        app: devops-webapp

    spec:
      containers:
      - name: devops-webapp

        image: reddy324/devops-webapp:latest

        ports:
        - containerPort: 3000
